<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White knockout of the official findtime-icon.svg. The FindTime brand page
       publishes no white icon, only the colored one and a dark-ink one, so this
       keeps the official geometry, stroke widths, and opacities and swaps every
       color for white. -->
  <!-- Bold C arc -->
  <path d="M20 4C11.163 4 4 11.163 4 20s7.163 16 16 16c5.2 0 9.8-2.5 12.7-6.3" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Single horizontal clock hand -->
  <line x1="20" y1="20" x2="28" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="20" cy="20" r="1.8" fill="#ffffff"/>
  <!-- Signal arcs -->
  <path d="M30 11.5c2.3 2.3 3.7 5.5 3.7 8.8s-1.4 6.5-3.7 8.8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M34 8c3 3 4.8 7.2 4.8 11.8s-1.8 8.8-4.8 11.8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
</svg>
